name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # app/ is uploaded to Pages verbatim, so the artefact in the working tree is
  # the artefact in production: a painting whose thumbnail was never committed
  # is a broken panel on the live site, and nothing between here and a visitor's
  # browser would have mentioned it. That is what these are here to catch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite is built into the two runtimes the project already uses:
      # node --test and unittest. Nothing is installed to run the tests
      # themselves — the pip step below installs the *pipeline*, which is also
      # the only thing that proves the pinned requirements still resolve.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: field arithmetic
        run: node --test tests/field.test.mjs

      - name: pipeline invariants and published dataset
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    # A pull request gets the checks and stops there: only main is published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # app/ is plain static files — no bundler, no npm install, nothing to build.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
